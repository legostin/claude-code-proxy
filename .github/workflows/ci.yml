name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and its marketplace
        run: claude plugin validate --strict .
      - name: Run the mod's tests
        run: claude plugin test .
      - name: Run the proxy's tests (openssl and curl against local upstreams)
        run: node --test sidecar/proxy.spec.mjs
      - name: Run the rules engine's tests
        run: node --test sidecar/rules.spec.mjs
      - name: Run the self guard's tests (Claude Code is never decrypted)
        run: node --test sidecar/selfguard.spec.mjs
